<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>문형복습 스튜디오</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><button id="homeBtn" class="brand"><b>復</b><span><strong>문형복습 스튜디오</strong><small>단어부터 문장까지 다시 연결해요</small></span></button></header>
  <main>
    <section id="home" class="screen active">
      <p class="eyebrow">ことばから 文型へ</p>
      <h1>아는 단어를 꺼내<br><em>문장으로 만들어 보세요.</em></h1>
      <p class="lead">단어의 한국어 뜻을 확인한 뒤, 같은 표현을 고르고 조립하고 직접 입력하며 복습합니다.</p>
      <div id="unitList" class="unit-list"></div>
      <aside>💡 모든 한자에는 후리가나가 표시됩니다.</aside>
    </section>
    <section id="lesson" class="screen">
      <button id="backBtn" class="back">← 단원 선택</button>
      <div class="lesson-title"><span id="badge"></span><div><h2 id="title"></h2><p id="subtitle"></p></div></div>
      <nav id="tabs" aria-label="복습 단계"></nav>
      <div id="content"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
