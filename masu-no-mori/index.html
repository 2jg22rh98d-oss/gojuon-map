<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#315c89">
  <meta name="description" content="일본어 동사 그룹과 ます·ません·ました·ませんでした를 단계적으로 익히는 학습 앱">
  <title>ますの森 — 일본어 동사 정중형 학습</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header><button id="homeBtn" class="brand"><b>ます</b><span><strong>ますの森</strong><small>동사 그룹과 정중형</small></span></button></header>
<main>
  <section id="home" class="screen active">
    <p class="eyebrow">VERB FORM LEARNING STUDIO</p>
    <h1>동사 그룹부터<br><em>현재와 과거</em>까지.</h1>
    <p class="lead">새 어휘를 읽고 동사 그룹을 판별한 뒤, 네 가지 정중형을 문장 속에서 반복해 익힙니다.</p>
    <div class="form-preview"><span><ruby>読<rt>よ</rt></ruby>み<b>ます</b></span><span><ruby>読<rt>よ</rt></ruby>み<b>ません</b></span><span><ruby>読<rt>よ</rt></ruby>み<b>ました</b></span><span><ruby>読<rt>よ</rt></ruby>み<b>ませんでした</b></span></div>
    <div id="unitList" class="unit-list"></div>
    <aside>💡 <b>ました</b>는 별개의 형태가 아니라 <b>ます의 과거 긍정형</b>입니다. 모든 한자에는 후리가나를 표시합니다.</aside>
  </section>
  <section id="lesson" class="screen">
    <button id="backBtn" class="back">← 학습 선택</button>
    <div class="lesson-title"><span id="badge"></span><div><h2 id="title"></h2><p id="subtitle"></p></div></div>
    <nav id="tabs"></nav><div id="content"></div>
  </section>
</main>
<script src="script.js?v=1"></script>
</body>
</html>
